<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Spool Status - Login</title>

    <style>
        body{
            margin:0;
            font-family:Arial, Helvetica, sans-serif;
            background:#f4f6f9;
            display:flex;
            justify-content:center;
            align-items:center;
            height:100vh;
        }

        .login-box{
            width:360px;
            background:white;
            padding:30px;
            border-radius:10px;
            box-shadow:0 5px 15px rgba(0,0,0,.15);
        }

        h2{
            text-align:center;
            margin-bottom:25px;
            color:#004d99;
        }

        input{
            width:100%;
            padding:12px;
            margin-top:10px;
            margin-bottom:18px;
            border:1px solid #ccc;
            border-radius:5px;
            box-sizing:border-box;
        }

        button{
            width:100%;
            padding:12px;
            background:#004d99;
            color:white;
            border:none;
            border-radius:5px;
            cursor:pointer;
            font-size:16px;
        }

        button:hover{
            background:#003366;
        }

        #error{
            color:red;
            margin-top:15px;
            text-align:center;
        }
    </style>
</head>

<body>

<div class="login-box">

    <h2>Live Spool Status</h2>

    <input
        type="email"
        id="email"
        placeholder="Email">

    <input
        type="password"
        id="password"
        placeholder="Password">

    <button id="loginBtn">
        Login
    </button>

    <div id="error"></div>

</div>

<script type="module">

import { auth } from "./firebase-config.js";

import {
    signInWithEmailAndPassword,
    onAuthStateChanged
}
from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";

onAuthStateChanged(auth,(user)=>{

    if(user){

        window.location.href="index.html";

    }

});

document
.getElementById("loginBtn")
.addEventListener("click",()=>{

    const email=document.getElementById("email").value.trim();

    const password=document.getElementById("password").value;

    signInWithEmailAndPassword(auth,email,password)

    .then(()=>{

        window.location.href="index.html";

    })

    .catch(error=>{

        document.getElementById("error").innerText=error.message;

    });

});

</script>

</body>
</html>
