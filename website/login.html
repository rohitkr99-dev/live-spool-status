<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#F3F4F9">
<title>DEE Piping Systems — Sign In</title>
<meta name="robots" content="noindex, nofollow">

<link rel="icon" href="assets/dee-mark.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;700;800;900&family=Manrope:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">

<link rel="stylesheet" href="css/styles.css?v=20260921">
<link rel="stylesheet" href="css/hub.css">

<style>
  /* Login-specific layout only - everything else (color, type, glass,
     radius, motion) comes from the shared design tokens in styles.css. */
  body.login {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }

  .login-card {
    position: relative;
    width: 100%;
    max-width: 380px;
    background: var(--glass-fill-strong);
    border: 1px solid var(--glass-border);
    border-radius: var(--radius-lg);
    box-shadow: var(--shadow-raised);
    backdrop-filter: var(--blur-glass);
    -webkit-backdrop-filter: var(--blur-glass);
    padding: 36px 32px 32px;
    opacity: 0;
    transform: translateY(14px);
    animation: riseIn 0.6s var(--ease-out) 0.1s forwards;
  }

  .login-card::before {
    content: "";
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 3px;
    border-radius: var(--radius-lg) var(--radius-lg) 0 0;
    background: linear-gradient(90deg, var(--ember) 0%, var(--ice) 100%);
  }

  .login-card__brand {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
    margin-bottom: 28px;
    text-align: center;
  }
  .login-card__brand img { width: 40px; height: 40px; }
  .login-card__brand h1 {
    font-family: var(--font-display);
    font-size: 20px;
    font-weight: 800;
    color: var(--frost);
    letter-spacing: -0.01em;
  }
  .login-card__brand p {
    font-size: 11px;
    font-weight: 500;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--frost-faint);
  }

  .login-field { margin-bottom: 16px; }
  .login-field label {
    display: block;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--frost-dim);
    margin-bottom: 6px;
  }
  .login-field input {
    width: 100%;
    font-family: var(--font-body);
    font-size: 14px;
    color: var(--frost);
    background: var(--bg-2);
    border: 1px solid var(--line-strong);
    border-radius: var(--radius-sm);
    padding: 11px 13px;
    transition: border-color 0.2s ease, box-shadow 0.2s ease;
  }
  .login-field input::placeholder { color: var(--frost-faint); }
  .login-field input:focus {
    outline: none;
    border-color: var(--ember);
    box-shadow: 0 0 0 3px var(--ember-soft);
  }

  .login-submit {
    width: 100%;
    justify-content: center;
    margin-top: 6px;
  }

  .login-error {
    display: flex;
    align-items: flex-start;
    gap: 8px;
    margin-top: 16px;
    padding: 10px 12px;
    border-radius: var(--radius-sm);
    background: var(--status-critical-soft);
    color: var(--status-critical);
    font-size: 12.5px;
    line-height: 1.4;
    opacity: 0;
    transform: translateY(-4px);
    max-height: 0;
    overflow: hidden;
    transition: opacity 0.2s var(--ease-out), transform 0.2s var(--ease-out), max-height 0.2s var(--ease-out), margin-top 0.2s var(--ease-out);
  }
  .login-error.is-shown {
    opacity: 1;
    transform: translateY(0);
    max-height: 80px;
  }
  .login-error svg { flex: none; margin-top: 1px; }

  @media (prefers-reduced-motion: reduce) {
    .login-card { animation: none; opacity: 1; transform: none; }
  }
</style>
</head>
<body class="login">

<div class="ambient" aria-hidden="true">
  <span class="ambient__orb ambient__orb--ember"></span>
  <span class="ambient__orb ambient__orb--ice"></span>
  <span class="ambient__orb ambient__orb--deep"></span>
  <div class="ambient__grid"></div>
</div>

<form class="login-card" id="login-form" novalidate>
  <div class="login-card__brand">
    <img src="assets/dee-mark.png" alt="">
    <h1>DEE Piping Systems</h1>
    <p>Operations Hub — Sign In</p>
  </div>

  <div class="login-field">
    <label for="email">Email address</label>
    <input type="email" id="email" name="email" placeholder="you@deepiping.com" autocomplete="username" required>
  </div>

  <div class="login-field">
    <label for="password">Password</label>
    <input type="password" id="password" name="password" placeholder="••••••••" autocomplete="current-password" required>
  </div>

  <button class="btn btn--primary login-submit" id="loginBtn" type="submit">
    <svg viewBox="0 0 20 20" width="15" height="15" aria-hidden="true"><path d="M8 4H5.5a1.5 1.5 0 0 0-1.5 1.5v9A1.5 1.5 0 0 0 5.5 16H8M13 13l3-3-3-3M16 10H7.5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
    Sign in
  </button>

  <div class="login-error" id="error" role="alert">
    <svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true"><circle cx="8" cy="8" r="6.5" fill="none" stroke="currentColor" stroke-width="1.4"/><path d="M8 5v3.5M8 11h.01" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
    <span id="error-text"></span>
  </div>
</form>

<!-- Firebase Libraries -->
<script src="https://www.gstatic.com/firebasejs/12.1.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/12.1.0/firebase-auth-compat.js"></script>

<!-- Firebase Configuration -->
<script src="firebase-config.js"></script>

<script>
const form = document.getElementById("login-form");
const errorBox = document.getElementById("error");
const errorText = document.getElementById("error-text");
const submitBtn = document.getElementById("loginBtn");

function showError(message) {
  errorText.textContent = message;
  errorBox.classList.add("is-shown");
}
function hideError() {
  errorBox.classList.remove("is-shown");
}

const FRIENDLY_ERRORS = {
  "auth/invalid-email": "That email address doesn't look right.",
  "auth/user-not-found": "No account found for that email.",
  "auth/wrong-password": "Incorrect password. Try again.",
  "auth/invalid-credential": "Email or password is incorrect.",
  "auth/too-many-requests": "Too many attempts. Wait a moment and try again.",
};

firebase.auth().onAuthStateChanged(function (user) {
  if (user) {
    window.location.href = "index.html";
  }
});

form.addEventListener("submit", function (event) {
  event.preventDefault();
  hideError();

  const email = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value;

  submitBtn.disabled = true;

  firebase.auth().signInWithEmailAndPassword(email, password)
    .then(function () {
      window.location.href = "index.html";
    })
    .catch(function (error) {
      submitBtn.disabled = false;
      showError(FRIENDLY_ERRORS[error.code] || "Couldn't sign in. Please try again.");
    });
});
</script>

</body>
</html>
